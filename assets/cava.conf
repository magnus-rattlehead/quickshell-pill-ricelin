[general]
bars = 8
framerate = 60
autosens = 1
sleep_timer = 0
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average

[smoothing]
monstercat = 0
noise_reduction = 35
